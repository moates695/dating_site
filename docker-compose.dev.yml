# Local Postgres for development only.
#
#     docker compose -f docker-compose.dev.yml up -d
#
# Production data lives on the droplet and is never touched by local testing.
# Postgres 16 to match the droplet (16.14).
#
# The credentials below are deliberately trivial and committed: this listens on
# 127.0.0.1 only and holds nothing but throwaway test rows. Real credentials
# belong in .env, which is gitignored.

name: event-picker-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: events-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
      POSTGRES_DB: event_picker_dev
    ports:
      # Bound to loopback so it is never reachable from the network. 5433 on the
      # host because Docker Desktop forwards through Windows, where 5432 is
      # already taken.
      - "127.0.0.1:5433:5432"
    volumes:
      - events-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d event_picker_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  events-pgdata:
