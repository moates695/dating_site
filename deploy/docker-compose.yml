# Deployment for the event picker on the droplet.
#
# The container joins the shared reverse-proxy network so nginx-proxy-prod can
# route events.moates.com.au to events-prod:8000 by name. It publishes no host
# port; nginx reaches it over the docker network.
#
# Do not run this by hand on the droplet. Deploy from a clone of this repo with:
#
#     deploy/deploy.sh

name: event-picker

services:
  events:
    build:
      context: ..
      dockerfile: Dockerfile
    image: event-picker:latest
    container_name: events-prod
    restart: unless-stopped

    # Holds DATABASE_URL and the Telegram credentials. Lives only on the
    # droplet; it is never in this repo. See README for its contents.
    env_file: /opt/event_picker/.env

    environment:
      APP_ENV: prod
      PAGES_DIR: /srv/pages

    volumes:
      # Published page bundles. Read-only: the app only ever serves from here,
      # publish.py writes to it over rsync.
      - /opt/event_picker/pages:/srv/pages:ro

    # Postgres runs on the host, not in Docker. pg_hba.conf already allows the
    # 172.16.0.0/12 docker ranges.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "8000"

    networks:
      - api-network

networks:
  # Created by the gym_junkie_server compose project and shared with the nginx
  # reverse proxy. External so this project never creates or removes it.
  api-network:
    external: true
    name: backend-prod_api-network
