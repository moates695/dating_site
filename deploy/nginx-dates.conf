# Server block for dates.moates.com.au.
#
# This is NOT loaded from here. The shared proxy renders its config from
# /root/gym_junkie_server/nginx/nginx.conf.template on the droplet. Paste this
# block in there alongside the mcp/chat/vault blocks, then:
#
#     ssh do docker restart nginx-proxy-prod
#
# The wildcard *.moates.com.au Cloudflare Origin certificate already covers this
# subdomain, so there is no certificate work. You do need a proxied A record for
# dates.moates.com.au pointing at the droplet's public IP. Keep it proxied: the
# origin should only ever be reached through Cloudflare.

server {
    listen 80;
    server_name dates.moates.com.au;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dates.moates.com.au;

    ssl_certificate     /etc/nginx/ssl/cloudflare-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options      "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # A page URL is a bearer credential: never let it leak via Referer, and
    # keep these pages out of every index.
    add_header Referrer-Policy      "no-referrer" always;
    add_header X-Robots-Tag         "noindex, nofollow, noarchive" always;

    # Submissions are small JSON documents; the app caps them at 32 KB.
    client_max_body_size 128k;

    location / {
        # Resolved at request time via the docker DNS resolver, so nginx still
        # starts when this container happens to be down, same pattern as the
        # mcp/chat/vault blocks.
        resolver 127.0.0.11 valid=10s;
        set $dates_upstream http://dates-prod:8000;
        proxy_pass $dates_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
